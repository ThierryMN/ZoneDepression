<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<style>
html, body, #map {
    height: 100%;
    margin: 0;
}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map');


    
L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: '&copy; Esri'
    }
).addTo(map);
L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
).addTo(map);
fetch('CUV300_FAB.geojson')
.then(r => r.json())
.then(data => {
    const couche = L.geoJSON(data, {
        style: {
            color: '#C19A6B',
            weight: 1,
            opacity: 0.9,
            fillColor: '#C19A6B',
            fillOpacity: 0.25
        }
    }).addTo(map);
    map.fitBounds(couche.getBounds());
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div');
        div.innerHTML =
            '<div style="background:white;padding:10px;border:1px solid #ccc;border-radius:5px;">' +
            '<div style="display:flex;align-items:center;">' +
            '<div style="width:20px;height:20px;background:#0096FF;border:1px solid #0096FF;opacity:0.25;margin-right:8px;"></div>' +
            '<span>Zone de dépression</span>' +
            '</div>' +
            '</div>';
        return div;
    };
    legend.addTo(map);
})
.catch(error => {
    console.error(error);
    alert('Erreur de lecture du GeoJSON');
});
</script>
</body>
</html>
